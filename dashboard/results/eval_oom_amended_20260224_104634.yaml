      \n### What’s happening (root cause)\nBoth pods run a Python command that **intentionally\
      \ leaks memory**:\n\n- It appends **~1MiB every second** (`data.append(\"x\"\
      *1000000)`)\n- The container has a **memory limit of 60Mi**\n- Result: the container\
      \ is **killed due to OOM (memory limit exceeded)**, then kubelet restarts it,\
      \ leading to **CrashLoopBackOff** (`Back-off restarting failed container` events\
      \ observed).\n\n### Fix options\n1. **Fix the app**: remove the unbounded memory\
      \ growth (preferred).\n2. **Increase memory limit** (only if expected/acceptable):\n\
      \   - update the Deployment to higher `resources.limits.memory` (and likely\
      \ `requests.memory`).\n3. **Add safeguards**:\n   - implement bounded caching\
      \ / backpressure\n   - set appropriate probes so failures are clearer, but probes\
      \ won’t prevent OOMKills.\n\n### Quick verification commands (optional, if you\
      \ want to run)\n- Check termination reason:\n  - `oc -n openshift-lightspeed\
      \ get pod <pod> -o jsonpath='{.status.containerStatuses[0].lastState.terminated.reason}{\"\
      \ \"}{.status.containerStatuses[0].lastState.terminated.exitCode}{\"\\n\"}'`\n\
      - Describe for OOMKilled / exit codes:\n  - `oc -n openshift-lightspeed describe\
      \ pod <pod>`\n\nTell me whether you want the **Deployment YAML patch** to raise\
      \ memory, or help **changing the code** to stop the leak."
