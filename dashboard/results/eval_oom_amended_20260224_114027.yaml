    response: "Which cluster/namespace/pod is showing **KubePodCrashLooping**? I need\
      \ at least one of these to investigate precisely.\n\nMeanwhile, here’s the fastest\
      \ OpenShift runbook to identify root cause and fix.\n\n## 1) Identify the crashing\
      \ pod(s)\n```bash\noc get events -A --field-selector reason=KubePodCrashLooping\
      \ -o wide\n# or quickly find restarts\noc get pods -A --sort-by=.status.containerStatuses[0].restartCount\n\
      ```\n\n## 2) Describe the pod (often shows the real error)\n```bash\noc -n <ns>\
      \ describe pod <pod>\n```\nLook for:\n- **Last State / Exit Code / Reason**\
      \ (e.g., OOMKilled, Error)\n- **Readiness/Liveness probe failures**\n- **FailedMount\
      \ / ImagePull errors / permission denied**\n\n## 3) Check container logs (current\
      \ + previous)\nCrashLoopBackOff usually requires **previous** logs:\n```bash\n\
      oc -n <ns> logs <pod> -c <container>\noc -n <ns> logs <pod> -c <container> --previous\n\
      ```\n\n## 4) Common causes → quickest fixes\n\n### A) App exits immediately\
      \ (exit code 1/2/…)\n- Misconfig (env var/secret/configmap), bad args/command,\
      \ missing file.\nFix:\n- Verify env/args:\n  ```bash\n  oc -n <ns> get pod <pod>\
      \ -o jsonpath='{.spec.containers[*].command}{\" \"}{.spec.containers[*].args}{\"\
      \\n\"}'\n  ```\n- Validate referenced secrets/configmaps exist.\n\n### B) **OOMKilled**\
      \ (exit code 137)\n- Memory limit too low or leak.\nFix:\n- Increase memory\
      \ limit/requests, or reduce app memory usage.\nCheck:\n```bash\noc -n <ns> describe\
      \ pod <pod> | egrep -i 'oomkilled|exit code|reason'\n```\n\n### C) Probe failures\
      \ (liveness/readiness)\n- Probe path/port wrong, startup too slow, TLS mismatch.\n\
      Fix:\n- Increase `initialDelaySeconds`/`timeoutSeconds`, use `startupProbe`,\
      \ correct port/path.\nEvidence is in `describe pod` events: “Liveness probe\
      \ failed…”.\n\n### D) Image issues\n- ImagePullBackOff / ErrImagePull, auth,\
      \ wrong tag, architecture mismatch.\nFix:\n- Check pull secret/Quay credentials,\
      \ image reference, node arch.\n```bash\noc -n <ns> describe pod <pod> | egrep\
      \ -i 'pull|image|back-off|unauthorized'\n```\n\n### E) Permissions / SCC / filesystem\
      \ read-only\n- “permission denied”, cannot write to volume, SCC mismatch.\n\
      Fix:\n- Use writable volumeMount, correct UID/fsGroup, adjust SCC via serviceaccount\
      \ (carefully).\nCheck events + logs.\n\n### F) Dependency not reachable (DB/endpoint)\n\
      - App crashes because it can’t reach DB/Kafka/etc.\nFix:\n- Confirm service/DNS,\
      \ network policies, secrets, routes.\nQuick test from same namespace:\n```bash\n\
      oc -n <ns> run -it --rm netdebug --image=registry.access.redhat.com/ubi9/ubi\
      \ -- bash\n```\n(Then test `curl`, `dig`, etc.)\n\n## Send me this and I’ll\
      \ pinpoint it\nPaste:\n1) `oc -n <ns> describe pod <pod>` (events + last state\
      \ section)  \n2) `oc -n <ns> logs <pod> -c <container> --previous`  \n3) Output\
      \ of `oc get pod -n <ns> <pod> -o wide`\n\nWith that, I can tell you the exact\
      \ failure mode and the minimal change to stop the CrashLoop."
