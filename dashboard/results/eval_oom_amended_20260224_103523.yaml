      - `awesome-application-7c5f7df47f-2hkqm` (container `app`)

      - `awesome-application-7c5f7df47f-qhj9r` (container `app`)


      ### What’s happening (root cause)

      Both pods are being **OOMKilled** and then restarted, leading to **CrashLoopBackOff**.


      Evidence from pod status:

      - `lastState.terminated.reason: OOMKilled`

      - `exitCode: 137`

      - Container has **memory limit 60Mi**

      - The container command is a Python loop that continuously allocates memory
      (`data.append("x"*1000000)`), i.e. an intentional **memory leak**.


      Events confirm the loop:

      - `Back-off restarting failed container app ... Reason: BackOff`


      ### Fix options

      1. **Fix the application** (stop unbounded memory growth) — the correct solution.

      2. If this is just a demo/test workload: **increase memory limits/requests**
      to avoid OOMKills (won’t fix the leak, only delays failure).

      3. If you just want the alert to stop: **scale down or delete** the workload
      running these pods (Deployment/ReplicaSet behind `awesome-application`).


      Tell me which outcome you want (repair app vs raise limits vs stop workload),
      and if you want I can pull the owning Deployment/ReplicaSet and propose the
      exact patch.'
